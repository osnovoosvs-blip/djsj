name: Build & Validate

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # нужно только для публикации релиза по тегу

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -e
          for f in build.gradle settings.gradle gradle.properties \
                   src/main/resources/fabric.mod.json \
                   src/main/resources/assets/bhop/lang/en_us.json \
                   src/main/java/com/example/bhop/BhopClient.java; do
            [ -f "$f" ] || { echo "::error file=$f::Missing required file: $f"; exit 1; }
          done

      - name: Validate JSON files
        run: |
          set -e
          for f in $(find src -name '*.json'); do
            jq empty "$f" || { echo "::error file=$f::Invalid JSON: $f"; exit 1; }
          done

      - name: Validate fabric.mod.json fields
        run: |
          set -e
          f=src/main/resources/fabric.mod.json
          for key in id version name entrypoints depends; do
            jq -e "has(\"$key\")" "$f" >/dev/null || { echo "::error file=$f::Missing key '$key'"; exit 1; }
          done
          entry=$(jq -r '.entrypoints.client[0]' "$f")
          path="src/main/java/$(echo "$entry" | tr . /).java"
          [ -f "$path" ] || { echo "::error file=$f::Entrypoint class '$entry' not found at $path"; exit 1; }
          pkg=$(grep -m1 '^package ' "$path" | sed 's/package \(.*\);/\1/')
          [ "$pkg.BhopClient" = "$entry" ] || { echo "::error file=$path::Package '$pkg' does not match entrypoint '$entry'"; exit 1; }

      - name: Check dependency versions exist on Fabric Maven
        run: |
          set -e
          p() { grep -E "^$1=" gradle.properties | cut -d= -f2-; }
          MC=$(p minecraft_version); Y=$(p yarn_mappings); L=$(p loader_version); F=$(p fabric_version)
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$1")
            if [ "$code" != "200" ]; then
              echo "::error file=gradle.properties::Not found ($code): $2 -> update it at https://fabricmc.net/develop"
              return 1
            fi
            echo "OK: $2"
          }
          ok=0
          check "https://maven.fabricmc.net/net/fabricmc/yarn/$Y/yarn-$Y.pom" "yarn $Y" || ok=1
          check "https://maven.fabricmc.net/net/fabricmc/fabric-loader/$L/fabric-loader-$L.pom" "loader $L" || ok=1
          check "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$F/fabric-api-$F.pom" "fabric-api $F" || ok=1
          exit $ok

      - name: Forbidden patterns (storage of secrets, tabs, CRLF)
        run: |
          set -e
          if grep -rIn $'\r' src build.gradle settings.gradle gradle.properties; then
            echo "::warning::CRLF line endings found"
          fi
          if grep -rInE '(ghp_|github_pat_|AKIA[0-9A-Z]{16})' . --exclude-dir=.git; then
            echo "::error::Possible secret committed"; exit 1
          fi

  build:
    name: Compile, test, package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Gradle version / environment
        run: |
          gradle --version
          java -version

      - name: Build (all warnings, full stacktrace)
        run: gradle build --warning-mode all --stacktrace --no-daemon

      - name: Verify jar contents
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          [ -n "$JAR" ] || { echo "::error::No jar produced"; exit 1; }
          echo "Jar: $JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json'                 || { echo "::error::fabric.mod.json missing in jar"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/example/bhop/BhopClient.class' || { echo "::error::BhopClient.class missing in jar"; exit 1; }
          unzip -p "$JAR" fabric.mod.json | jq -e '.version | test("\\$\\{") | not' >/dev/null \
            || { echo "::error::Version placeholder was not expanded"; exit 1; }
          unzip -p "$JAR" fabric.mod.json | jq .

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build result"
            echo "- Minecraft: $(grep ^minecraft_version gradle.properties | cut -d= -f2)"
            echo "- Jars:"
            ls -1 build/libs 2>/dev/null | sed 's/^/ - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bhop-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
